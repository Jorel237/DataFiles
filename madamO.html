<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madam O — Salon de Coiffure</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fff8f3;
      color: #2d2a26;
    }

    header {
      background: linear-gradient(135deg, #7b3f00, #b5651d);
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      background: #eadfd3;
      cursor: pointer;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #b5651d;
      color: white;
    }

    .styles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .style-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .style-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .style-info {
      padding: 15px;
    }

    .style-info h3 {
      margin-bottom: 6px;
    }

    .price {
      color: #b5651d;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .book-btn {
      width: 100%;
      padding: 10px;
      border: none;
      background: #7b3f00;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .book-btn:hover {
      background: #5c2e00;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
    }

    .modal-content h3 {
      margin-bottom: 15px;
    }

    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #b5651d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .close {
      float: right;
      font-size: 22px;
      cursor: pointer;
    }

    .owner-section {
      margin-top: 45px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .owner-section input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #7b3f00;
      color: white;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>

<body>

  <header>
    <h1>MADAM O</h1>
    <p>Salon de coiffure pour hommes et femmes</p>
  </header>

  <div class="container">

    <div class="filters">
      <button class="filter-btn active" data-category="all">Tous</button>
      <button class="filter-btn" data-category="femme">Femme</button>
      <button class="filter-btn" data-category="homme">Homme</button>
      <button class="filter-btn" data-category="enfant">Enfant</button>
    </div>

    <div class="styles" id="styleList"></div>

    <div class="owner-section">
      <h2>Espace Salon — Créer le QR Code</h2>
      <p>
        Entrez l’adresse de cette page après l’avoir publiée en ligne,
        par exemple : <b>https://votre-nom.github.io/madam-o</b>
      </p>

      <input type="url" id="salonUrl" placeholder="https://votre-site-madam-o.com" />

      <button class="submit-btn" onclick="generateQR()">
        Générer le QR Code
      </button>

      <div id="qrcode"></div>
    </div>
  </div>

  <div class="modal" id="bookingModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <h3>Prendre rendez-vous</h3>

      <input type="text" id="clientName" placeholder="Votre nom" />
      <input type="tel" id="clientPhone" placeholder="Numéro WhatsApp / téléphone" />
      <select id="clientStyle">
        <option>Choisir une coiffure</option>
      </select>
      <textarea id="clientMessage" placeholder="Date, heure ou message"></textarea>

      <button class="submit-btn" onclick="sendBooking()">
        Envoyer la demande
      </button>
    </div>
  </div>

  <footer>
    © <span id="year"></span> Madam O — Salon de coiffure
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const hairstyles = [
      {
        name: "Tresses collées",
        category: "femme",
        price: "5 000 FCFA",
        image: "https://images.unsplash.com/photo-1595475207225-428b62bda831?auto=format&fit=crop&w=800&q=60"
      },
      {
        name: "Vanilles / Twists",
        category: "femme",
        price: "7 000 FCFA",
        image: "https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=800&q=60"
      },
      {
        name: "Coupe dégradé",
        category: "homme",
        price: "2 000 FCFA",
        image: "https://images.unsplash.com/photo-1605497788044-5a32c7078586?auto=format&fit=crop&w=800&q=60"
      },
      {
        name: "Coupe barbe + cheveux",
        category: "homme",
        price: "3 000 FCFA",
        image: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=60"
      },
      {
        name: "Coupe enfant",
        category: "enfant",
        price: "1 500 FCFA",
        image: "https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=800&q=60"
      },
      {
        name: "Tissage / Pose de mèches",
        category: "femme",
        price: "10 000 FCFA",
        image: "https://images.unsplash.com/photo-1560869713-7d0954650c39?auto=format&fit=crop&w=800&q=60"
      }
    ];

    const styleList = document.getElementById("styleList");
    const clientStyle = document.getElementById("clientStyle");

    function showStyles(category) {
      styleList.innerHTML = "";
      clientStyle.innerHTML = "<option>Choisir une coiffure</option>";

      hairstyles
        .filter(item => category === "all" || item.category === category)
        .forEach(item => {
          styleList.innerHTML += `
            <div class="style-card">
              <img src="${item.image}" alt="${item.name}">
              <div class="style-info">
                <h3>${item.name}</h3>
                <p class="price">${item.price}</p>
                <button class="book-btn" onclick="openBooking('${item.name}')">
                  Réserver
                </button>
              </div>
            </div>
          `;

          clientStyle.innerHTML += `<option>${item.name}</option>`;
        });
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        showStyles(button.dataset.category);
      });
    });

    function openBooking(styleName) {
      document.getElementById("bookingModal").style.display = "flex";
      clientStyle.value = styleName;
    }

    function closeModal() {
      document.getElementById("bookingModal").style.display = "none";
    }

    function sendBooking() {
      const name = document.getElementById("clientName").value.trim();
      const phone = document.getElementById("clientPhone").value.trim();
      const style = clientStyle.value;
      const message = document.getElementById("clientMessage").value.trim();

      if (!name || !phone) {
        alert("Veuillez entrer votre nom et votre numéro.");
        return;
      }

      const salonNumber = "237600000000"; // Remplacez par le numéro WhatsApp du salon

      const text =
        "Bonjour Madam O,%0A" +
        "Je souhaite prendre rendez-vous.%0A" +
        "Nom : " + name + "%0A" +
        "Téléphone : " + phone + "%0A" +
        "Coiffure : " + style + "%0A" +
        "Message : " + message;

      window.open("https://wa.me/" + salonNumber + "?text=" + text, "_blank");
      closeModal();
    }

    function generateQR() {
      const url = document.getElementById("salonUrl").value.trim();

      if (!url) {
        alert("Entrez d’abord l’adresse de votre site Madam O.");
        return;
      }

      document.getElementById("qrcode").innerHTML = "";

      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 220,
        height: 220,
        colorDark: "#7b3f00",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    showStyles("all");
  </script>
</body>
</html>
